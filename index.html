<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ICT 10 Seatwork 1</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 30px;
        }

        h1 {
            color: #2c3e50;
        }

        h2 {
            color: #2c3e50;
            margin-top: 20px;
        }

        input {
            padding: 5px;
            margin-right: 10px;
        }

        button {
            padding: 6px 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #info, #results {
            background-color: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>ICT 10 - Seatwork #1</h1>

    <h2>My Information</h2>
    <div id="info">
        <div id="name">My name is</div>
        <div id="age">My age is</div>
        <div id="height">My height (in cm) is</div>
        <div id="countries">Countries I want to visit:</div>
        <div id="student">I'm a new student:</div>
        <div id="favorites">My favorites:</div>
        <div id="fruits">My favorite fruits:</div>
        <div id="days">Days of the week:</div>
    </div>

    <hr>

    <h2>Simple Calculator</h2>
    <input type="text" id="text1" placeholder="Enter the number here">
    <input type="text" id="text2" placeholder="Enter the number here">
    <br><br>
    <button py-click="solve">Calculate</button>

    <br><br>
    <div id="results">
        <div id="add"></div>
        <div id="sub"></div>
        <div id="mul"></div>
        <div id="div"></div>
        <div id="floor"></div>
        <div id="mod"></div>
        <div id="exp"></div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
